<div class="page">
  <h1>Inventory</h1>
  <p *ngIf="loading">Loading inventory...</p>

  <p class="error" *ngIf="errorMessage">
    {{ errorMessage }}
  </p>

  <table *ngIf="!loading && inventory.length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Product ID</th>
        <th>Quantity</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of inventory">
        <td> {{ item.id }} </td>
        <td> {{ item.productId }} </td>
        <td> {{ item.quantity }} </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && inventory.length === 0">
    No inventory found.
  </p>

</div>
