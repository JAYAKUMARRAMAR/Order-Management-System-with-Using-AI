<div class="page">
  <h1>Orders with Items</h1>
  <p *ngIf="loading">
    Loading orders...
  </p>
  <p class="error" *ngIf="errorMessage">
    {{ errorMessage }}
  </p>

  <table *ngIf="!loading && orders.length > 0">
    <thead>
      <tr>
        <th>Item ID</th>
        <th>Order ID</th>
        <th>Product ID</th>
        <th>Quantity</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let order of orders">
        <tr *ngFor="let item of order.items">
          <td>{{ item.itemId }}</td>
          <td>{{ order.id }}</td>
          <td>{{ item.productId }}</td>
          <td>{{ item.quantity }}</td>
          <td>{{ order.status }}</td>
        </tr>
      </ng-container>
    </tbody>
  </table>

  <p *ngIf="!loading && orders.length === 0">
    No orders found.
  </p>

</div>
