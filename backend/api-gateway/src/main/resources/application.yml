spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "${GATEWAY_ALLOWED_ORIGIN:http://localhost:4200}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}

          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/products/**

            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/inventory/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/orders/**
            
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/auth/**

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:my-super-secret-key-for-jwt-authentication-2026}


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info