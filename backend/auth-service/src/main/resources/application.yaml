server:
  port: 8090

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth_service_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-for-jwt-authentication-2026}
  expiration: 3600000

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}

auth:
  cors:
    allowed-origin: ${AUTH_CORS_ALLOWED_ORIGIN:http://localhost:4200}
  email-verification:
    url: ${EMAIL_VERIFICATION_URL:http://localhost:8090/auth/verify-email}
    expiration: ${EMAIL_VERIFICATION_EXPIRATION:86400000}

internal:
  api:
    token: ${INTERNAL_API_TOKEN:}